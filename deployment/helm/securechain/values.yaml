replicaCount: 2

image:
  repository: ghcr.io/securechain/platform
  tag: "1.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

env:
  DATABASE_URL: "postgresql+asyncpg://postgres:changeme@postgres:5432/securechain"
  SECRET_KEY: "replace-with-k8s-secret"
  CORS_ORIGINS: '["https://securechain.example.com"]'

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

metrics:
  enabled: true
  path: /metrics
